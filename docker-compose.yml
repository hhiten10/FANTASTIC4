services:
  api:
    build: .
    # Generate the synthetic data on first start; train only if no saved model exists.
    command: >
      sh -c "test -f data/raw/sensor_readings.csv || python generate_data.py;
             test -f models/model.joblib || python train.py;
             uvicorn api:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    volumes: ["./data:/app/data", "./models:/app/models", "./reports:/app/reports"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 30

  ui:
    build: .
    command: streamlit run app.py --server.address 0.0.0.0 --server.port 8501
    environment: ["API_URL=http://api:8000"]
    ports: ["8501:8501"]
    volumes: ["./reports:/app/reports"]
    depends_on:
      api: {condition: service_healthy}
